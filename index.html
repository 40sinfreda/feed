<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#b71c1c" id="meta-theme">
  <meta name="apple-mobile-web-app-title" content="הזמנת תערובת">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo.svg">
  <title>הזמנת תערובת</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="splash" id="splash">
    <div class="splash-logo"><img src="logo.svg" alt="לוגו"></div>
    <h2>הזמנת תערובת</h2>
    <p id="splash-sub">טוען את המערכת...</p>
    <div class="bar" id="splash-bar"><span></span></div>
    <div class="splash-actions" id="splash-actions">
      <button class="btn btn-primary" onclick="installApp()">התקן</button>
      <button class="btn btn-outline" style="margin-top:10px;color:#eee;border-color:#5a3a3e;" onclick="enterApp()">המשך בלי התקנה</button>
      <div class="ios-hint" id="ios-hint">באייפון: לחץ שיתוף ← «הוסף למסך הבית»</div>
    </div>
  </div>
  <div id="app-root"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="ui.js"></script>
</body>
</html>
